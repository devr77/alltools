name: Deploy test page to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['torrent/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site (serve torrent/ at /torrent/)
        run: |
          mkdir -p _site
          cp -r torrent _site/torrent
          echo '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=torrent/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
