name: Deploy torrent tools to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['torrent/**', '.github/workflows/deploy-test.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and generate pages
        working-directory: torrent
        run: |
          npm test
          npm run build
      - uses: actions/configure-pages@v5
      - name: Build site (serve torrent/ at /torrent/)
        run: |
          mkdir -p _site/torrent
          cp -r torrent/index.html torrent/sitemap.xml torrent/assets _site/torrent/
          # Tool pages are the folders containing an index.html (skips tests/ and scripts/).
          for dir in torrent/*/; do
            if [ -f "${dir}index.html" ]; then cp -r "${dir%/}" _site/torrent/; fi
          done
          # Search Console HTML-file verification, if one was added (google<token>.html).
          cp torrent/google*.html _site/torrent/ 2>/dev/null || true
          # GitHub Pages serves the project-root 404.html for any missing URL under /alltools/.
          cp torrent/404.html _site/404.html
          echo '<!DOCTYPE html><link rel="canonical" href="https://devr77.github.io/alltools/torrent/"><meta http-equiv="refresh" content="0; url=torrent/">' > _site/index.html
          ls -R _site | head -40
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
