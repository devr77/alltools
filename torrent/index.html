<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deploy Test</title>
  <style>
    :root { --bg: #f7f7f5; --fg: #1a1a1a; --muted: #666; --ok: #1f8a4c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #151515; --fg: #eee; --muted: #999; --ok: #4ade80; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif; padding: 16px;
    }
    main { text-align: center; }
    .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); margin-right: 8px; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: var(--muted); margin: 4px 0; }
    code { font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1><span class="dot"></span>Deployment works</h1>
    <p>This static page was served from GitHub.</p>
    <p>Build: <code>v1</code></p>
    <p>Loaded at: <code id="t"></code></p>
  </main>
  <script>
    document.getElementById('t').textContent = new Date().toLocaleString();
  </script>
</body>
</html>
